openapi: 3.1.0
info:
  title: AURA Note v1 API
  version: 0.1.0
  description: Initial API contract seed for AURA Note standalone and ClinicOS-integrated modes.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200': { description: OK }
  /schedule/appointments:
    get:
      operationId: listAppointments
      responses:
        '200':
          description: Appointment list with note shell status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewResponse'
    post:
      operationId: createAppointment
      description: Create standalone appointment and one-to-one note shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Created appointment and one-to-one note shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppointmentResponse'
  /schedule/appointments/{appointmentId}/start-visit:
    post:
      operationId: startVisit
      description: Starts visit session scaffold and activates note shell. Full timer, recording, and transcription depth is implemented in later work orders.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartVisitResponse'
  /notes/drafts:
    get:
      operationId: listDraftNotes
      description: CP-1 implemented Draft Notes shell for notes that have entered the visit workflow.
      responses:
        '200':
          description: Draft notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftNotesViewResponse'
  /notes/finalized:
    get:
      operationId: listFinalizedNotes
      description: CP-1 implemented read-only finalized note list shell.
      responses:
        '200':
          description: Finalized notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNotesViewResponse'
  /notes/finalized/{noteId}:
    get:
      operationId: getFinalizedNoteReadOnly
      description: CP-1 read-only finalized note placeholder. Does not generate or edit final clinical content.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Read-only finalized note placeholder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNoteResponse'
  /documentation-workspace/appointments/{appointmentId}:
    get:
      operationId: getDocumentationWorkspaceByAppointment
      description: CP-1 implemented Documentation Workspace shell for an appointment-linked note.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Documentation Workspace shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationWorkspaceResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/pause:
    post:
      operationId: pauseVisitSession
      description: Pause the CP-1 synthetic visit timer and lock the editor.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/resume:
    post:
      operationId: resumeVisitSession
      description: Resume the CP-1 synthetic visit timer and unlock the editor.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/stop:
    post:
      operationId: stopVisitSession
      description: Stop the CP-1 synthetic visit timer and normal recording scaffold.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/recording-exception:
    post:
      operationId: approveRecordingException
      description: Approve a no-audio documentation exception without marking normal recording active.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingExceptionRequest'
      responses:
        '201':
          description: Recording exception approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/transcript:
    get:
      operationId: getMockTranscript
      description: Read CP-1 mock transcript segments. Transcript retention is indefinite.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Mock transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptResponse'
  /documentation-workspace/appointments/{appointmentId}/transcript/segments:
    post:
      operationId: appendMockTranscriptSegment
      description: Append a synthetic mock transcript segment while the timer or exception gate allows documentation.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendTranscriptSegmentRequest'
      responses:
        '201':
          description: Mock transcript segment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Note }
    patch:
      operationId: updateNoteDraft
      description: Update note draft only when timer gate permits editing.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
  /notes/{noteId}/suggestions/evaluate:
    post:
      operationId: evaluateSuggestions
      responses:
        '201':
          description: Deterministic CP-1 suggestions evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/suggestions:
    get:
      operationId: listSuggestions
      responses:
        '200':
          description: Deterministic CP-1 suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsViewResponse'
  /notes/{noteId}/suggestions/{suggestionId}/accept:
    post:
      operationId: acceptSuggestion
      description: Accept a draft-only suggestion into Visit Selections. Low-confidence diagnosis candidates require override metadata.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '201':
          description: Suggestion accepted into Visit Selections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/suggestions/{suggestionId}/remove:
    post:
      operationId: removeSuggestion
      responses:
        '201':
          description: Suggestion removed from candidate review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/visit-selections:
    get:
      operationId: listVisitSelections
      responses:
        '200':
          description: Visit Selections for the note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSelectionsViewResponse'
    post:
      operationId: addVisitSelection
      responses:
        '201':
          description: Visit selection added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/compliance/evaluate:
    post:
      operationId: evaluateCompliance
      responses:
        '200': { description: Compliance evaluated }
  /notes/{noteId}/compliance:
    get:
      operationId: getComplianceReview
      responses:
        '200':
          description: Compliance and quality review state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReviewResponse'
  /notes/{noteId}/history-gaps:
    get:
      operationId: listHistoryGaps
      responses:
        '200':
          description: History gap questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryGapQuestionsResponse'
  /notes/{noteId}/history-gaps/{questionId}/tasks:
    post:
      operationId: createHistoryGapTask
      description: Create an MA follow-up task from a History Gap question. Blocking tasks prevent finalize preparation.
      responses:
        '201':
          description: History Gap task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/tasks:
    post:
      operationId: createNoteTask
      responses:
        '201': { description: Task created }
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      responses:
        '200': { description: Task updated }
  /notes/{noteId}/finalization/start:
    post:
      operationId: startFinalization
      description: Start the WO-006 finalization wizard from a frozen synthetic note snapshot.
      responses:
        '201':
          description: Finalization started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization:
    get:
      operationId: getFinalizationSession
      responses:
        '200':
          description: Current finalization session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationSessionResponse'
  /notes/{noteId}/finalization/code-review/selections/{visitSelectionId}:
    post:
      operationId: decideFinalizationSelection
      description: Record a Step 1 keep/remove/convert/follow-up decision for a selected item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizationSelectionDecisionRequest'
      responses:
        '201':
          description: Selection decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/code-review/complete:
    post:
      operationId: completeCodeReview
      responses:
        '201':
          description: Code Review completed when every selected item has a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/suggestion-review/suggestions/{suggestionId}:
    post:
      operationId: decideFinalizationSuggestion
      description: Record a Step 2 keep/remove decision for a final-pass suggestion over 50 percent confidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizationSuggestionDecisionRequest'
      responses:
        '201':
          description: Suggestion decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/suggestion-review/complete:
    post:
      operationId: completeSuggestionReview
      responses:
        '201':
          description: Suggestion Review completed when every final-pass suggestion has a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compose:
    post:
      operationId: composeFinalizationDrafts
      responses:
        '201':
          description: Deterministic mock compose completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/original:
    post:
      operationId: updateCompareEditOriginal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareEditUpdateRequest'
      responses:
        '201':
          description: Original-side compare/edit text updated and enhanced output marked stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/rebeautify:
    post:
      operationId: rebeautifyFinalization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebeautifyRequest'
      responses:
        '201':
          description: Enhanced note and patient summary regenerated from updated source text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/approve-note:
    post:
      operationId: approveFinalNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '201':
          description: Final note approved for Step 4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/approve-summary:
    post:
      operationId: approvePatientSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '201':
          description: Patient summary approved for Step 4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/billing-attest/draft-claim-preview:
    post:
      operationId: generateDraftClaimPreview
      description: Generate an internal draft claim preview. This does not submit a claim or finalize billing.
      responses:
        '201':
          description: Draft claim preview generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/billing-attest/complete:
    post:
      operationId: completeBillingAttest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAttestRequest'
      responses:
        '201':
          description: Billing & Attest completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/sign-dispatch:
    post:
      operationId: signAndDispatch
      responses:
        '201':
          description: Signed and dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/exports/final-note-pdf:
    post:
      operationId: generateFinalNotePdf
      responses:
        '201':
          description: Signed final note PDF artifact generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportActionResponse'
  /notes/{noteId}/exports/patient-summary-pdf:
    post:
      operationId: generatePatientSummaryPdf
      responses:
        '201':
          description: Signed patient summary PDF artifact generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportActionResponse'
  /notes/{noteId}/exports/final-note-copy:
    post:
      operationId: copyFinalNote
      responses:
        '201':
          description: Signed final note copy-safe artifact prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportActionResponse'
  /notes/{noteId}/exports/patient-summary-copy:
    post:
      operationId: copyPatientSummary
      responses:
        '201':
          description: Signed patient summary copy-safe artifact prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportActionResponse'
  /notes/{noteId}/exports/structured:
    post:
      operationId: exportStructuredFinalNote
      responses:
        '201':
          description: Signed final note structured export artifact generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportActionResponse'
  /notes/{noteId}/ehr-writeback:
    post:
      operationId: requestEhrWriteback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhrWritebackRequest'
      responses:
        '201':
          description: EHR writeback queue status recorded in scaffold mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhrWritebackActionResponse'
  /notes/{noteId}/billing/draft-claim-preview:
    get:
      operationId: getDraftClaimPreview
      responses:
        '200': { description: Draft claim preview }
  /settings/templates:
    get:
      operationId: listTemplates
      responses:
        '200': { description: Templates }
    post:
      operationId: createTemplate
      responses:
        '201': { description: Template created }
  /settings/dot-phrases:
    get:
      operationId: listDotPhrases
      responses:
        '200': { description: Dot phrases }
    post:
      operationId: createDotPhrase
      responses:
        '201': { description: Dot phrase created }
  /coaching/own:
    get:
      operationId: getOwnCoaching
      description: WO-012 implemented synthetic own-clinician coaching report. Coaching is clinician-only and excluded from patient-facing outputs.
      responses:
        '200':
          description: Own clinician coaching report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingReportResponse'
  /coaching/dashboard:
    get:
      operationId: getCoachingDashboard
      description: WO-012 implemented premium coaching dashboard scaffold. Aggregate-only mode hides individual provider identifiers.
      parameters:
        - in: query
          name: visibilityMode
          required: false
          schema:
            type: string
            enum: [aggregate_only, full_admin]
      responses:
        '200':
          description: Premium coaching dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingDashboardResponse'
  /support/status:
    get:
      operationId: getSupportStatus
      description: WO-013 implemented support hardening status with feature flags, retention policies, redacted logging posture, and safe degraded modes.
      responses:
        '200':
          description: Support hardening status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportStatusResponse'
  /support/audit-exports:
    post:
      operationId: requestAuditExport
      description: WO-013 implemented redacted metadata-only audit export scaffold. Does not deliver files or include PHI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '201':
          description: Redacted synthetic audit export metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
  /ai-gateway/status:
    get:
      operationId: getAiGatewayStatus
      description: WO-009 implemented mock-only AI gateway status. External AI remains disabled.
      responses:
        '200':
          description: AI gateway safety policy and prompt registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayStatusResponse'
  /ai-gateway/mock-invocations:
    post:
      operationId: invokeMockAiGateway
      description: WO-009 implemented mock AI invocation through PHI boundary and governance metadata. Does not call external AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGatewayInvocationRequest'
      responses:
        '201':
          description: Mock AI response with source-linked, human-review-required metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayInvocationResponse'
        '400':
          description: Raw PHI rejected before model invocation.
  /integrations/ehr/status:
    get:
      operationId: getEhrStatus
      responses:
        '200':
          description: WO-010 implemented EHR adapter status with standalone-safe disabled mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhrIntegrationStatusResponse'
  /integrations/ehr/chart-context/{safePatientId}/{externalEncounterId}:
    get:
      operationId: getEhrChartContext
      description: WO-010 implemented synthetic chart-context retrieval through the EHR adapter boundary.
      parameters:
        - name: safePatientId
          in: path
          required: true
          schema: { type: string }
        - name: externalEncounterId
          in: path
          required: true
          schema: { type: string }
        - name: slices
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Source-linked synthetic chart context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhrChartContextResponse'
  /integrations/clinicos/status:
    get:
      operationId: getClinicOsStatus
      responses:
        '200':
          description: WO-011 implemented ClinicOS mode status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicOsIntegrationStatusResponse'
  /integrations/clinicos/map-visit:
    post:
      operationId: mapClinicOsVisitContext
      description: WO-011 implemented mock ClinicOS VisitGraph/M17 mapping for appointment-note context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicOsMapVisitRequest'
      responses:
        '201':
          description: ClinicOS visit context mapping recorded or safely skipped when unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicOsMapVisitResponse'
components:
  schemas:
    ApiMeta:
      type: object
      properties:
        requestId: { type: string }
        traceId: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
        generatedAt: { type: string, format: date-time }
    ApiWarning:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [info, warning, error] }
    Appointment:
      type: object
      required: [appointmentId, tenantId, siteId, safePatientId, clinicianId, noteId, state, startsAt, durationMinutes, visitType, modality, source, mode]
      properties:
        appointmentId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        noteId: { type: string }
        state:
          type: string
          enum: [scheduled, checked_in, in_room, visit_started, visit_paused, visit_completed, finalization_in_progress, finalized, cancelled, no_show]
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        visitType: { type: string }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        source: { type: string, enum: [standalone, ehr_import, clinicos] }
        reasonForVisit: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
    CreateAppointmentRequest:
      type: object
      required: [safePatientId, clinicianId, visitType, startsAt, durationMinutes, modality]
      properties:
        safePatientId: { type: string }
        clinicianId: { type: string }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        reasonForVisit: { type: string }
    ScheduleAppointment:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [noteStatus, noteVisibleInDrafts, startVisitEnabled, ehrSchedulingEnabled, clinicOsSchedulingEnabled]
          properties:
            noteStatus:
              type: string
              enum: [shell_created, draft_not_started, visit_active, visit_paused, documentation_in_progress, ready_to_finalize, finalization_code_review, finalization_suggestion_review, finalization_compose, finalization_compare_edit, finalization_billing_attest, finalization_sign_dispatch, blocked_compliance, blocked_history_gap, blocked_billing_review, finalized, exported, writeback_pending, writeback_complete, writeback_failed]
            noteVisibleInDrafts: { type: boolean }
            startVisitEnabled: { type: boolean }
            ehrSchedulingEnabled: { type: boolean }
            clinicOsSchedulingEnabled: { type: boolean }
    ScheduleView:
      type: object
      required: [appointments, ehrSchedulingEnabled, clinicOsSchedulingEnabled]
      properties:
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleAppointment'
        ehrSchedulingEnabled: { type: boolean }
        clinicOsSchedulingEnabled: { type: boolean }
    ScheduleViewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ScheduleView'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    CreateAppointmentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
