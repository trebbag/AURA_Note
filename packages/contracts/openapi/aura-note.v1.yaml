components:
  schemas:
    ApiMeta:
      type: object
      properties:
        requestId: { type: string }
        traceId: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
        generatedAt: { type: string, format: date-time }
    ApiWarning:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [info, warning, error] }
    IdentityAdapterStatusView:
      type: object
      required: [adapterId, kind, identityProviderMode, status, configured, liveCredentialPresent, delegatedIdentityAllowed]
      properties:
        adapterId: { type: string }
        kind: { type: string, enum: [local_dev, oidc, saml, clinicos_delegate] }
        identityProviderMode: { type: string, enum: [local_synthetic, clinicos_delegate, oidc_delegate, saml_delegate] }
        status: { type: string, enum: [ready_local, disabled_until_configured, unsupported_without_credentials] }
        configured: { type: boolean }
        liveCredentialPresent: { type: boolean, enum: [false] }
        delegatedIdentityAllowed: { type: boolean }
        disabledReason: { type: string }
    WorkforceUserAdmin:
      type: object
      required: [userId, tenantId, siteIds, role, status, allowedPurposes, disabledUserBlocked, syntheticOnly]
      properties:
        userId: { type: string }
        tenantId: { type: string }
        siteIds:
          type: array
          items: { type: string }
        role: { type: string, enum: [clinician, ma, billing_staff, admin, authorized_admin, clinic_manager, compliance_privacy_lead, support, service_account] }
        status: { type: string, enum: [active, disabled] }
        allowedPurposes:
          type: array
          items: { type: string, enum: [treatment, payment, operations, support, audit, coaching, break_glass] }
        disabledUserBlocked: { type: boolean }
        syntheticOnly: { type: boolean, enum: [true] }
    SecretSourceStatus:
      type: object
      required: [secretName, source, configured, valueReturned, requiredFor]
      properties:
        secretName: { type: string }
        source: { type: string, enum: [not_configured, environment_reference, secret_manager_reference] }
        configured: { type: boolean }
        valueReturned: { type: boolean, enum: [false] }
        requiredFor: { type: string, enum: [identity_provider, live_transcription, external_ai, ehr_writeback, production_storage, retention_deletion, patient_facing_estimates, claim_submission] }
    GovernedFeatureFlag:
      type: object
      required: [key, enabled, defaultValue, governs, highRisk, approvalRequired, runtimeEffect, liveExecutionEnabled, visibleToAdmins]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        defaultValue: { type: boolean, enum: [false] }
        governs: { type: string, enum: [live_transcription, external_ai, ehr_writeback, production_storage, retention_deletion, patient_facing_estimates, claim_submission] }
        highRisk: { type: boolean, enum: [true] }
        approvalRequired: { type: boolean, enum: [true] }
        approvalId: { type: string }
        runtimeEffect: { type: string, enum: [disabled, metadata_only_no_live_execution] }
        liveExecutionEnabled: { type: boolean, enum: [false] }
        visibleToAdmins: { type: boolean, enum: [true] }
    PlatformAdminView:
      type: object
      required: [tenant, sites, identityAdapters, users, sessionPolicies, secretSources, featureFlags, modeMappings, states, demoFixture]
      properties:
        tenant:
          type: object
          required: [tenantId, displayName, standaloneOwned]
          properties:
            tenantId: { type: string }
            displayName: { type: string }
            standaloneOwned: { type: boolean, enum: [true] }
        sites:
          type: array
          items:
            type: object
            required: [siteId, displayName, status]
            properties:
              siteId: { type: string }
              displayName: { type: string }
              status: { type: string, enum: [active] }
        identityAdapters:
          type: array
          items:
            $ref: '#/components/schemas/IdentityAdapterStatusView'
        users:
          type: array
          items:
            $ref: '#/components/schemas/WorkforceUserAdmin'
        sessionPolicies:
          type: object
          required: [expirationEnforced, disabledUsersFailClosed, purposeOfUseRequired, spoofedTenantDenied]
          properties:
            expirationEnforced: { type: boolean, enum: [true] }
            disabledUsersFailClosed: { type: boolean, enum: [true] }
            purposeOfUseRequired: { type: boolean, enum: [true] }
            spoofedTenantDenied: { type: boolean, enum: [true] }
        secretSources:
          type: array
          items:
            $ref: '#/components/schemas/SecretSourceStatus'
        featureFlags:
          type: array
          items:
            $ref: '#/components/schemas/GovernedFeatureFlag'
        modeMappings:
          type: array
          items:
            type: object
            required: [localObject, clinicosTarget, status]
            properties:
              localObject: { type: string }
              clinicosTarget: { type: string }
              status: { type: string, enum: [safe_degraded, not_configured] }
        states:
          type: array
          items: { type: string }
        demoFixture: { type: boolean, enum: [true] }
    SessionEvaluationRequest:
      type: object
      required: [userId, sessionId, tenantId, siteId, identityProviderMode, expiresAt]
      properties:
        userId: { type: string }
        sessionId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        identityProviderMode: { type: string, enum: [local_synthetic, clinicos_delegate, oidc_delegate, saml_delegate] }
        purposeOfUse: { type: string, enum: [treatment, payment, operations, support, audit, coaching, break_glass] }
        expiresAt: { type: string, format: date-time }
        disabled: { type: boolean }
    SessionEvaluation:
      type: object
      required: [allowed, userId, sessionId, identityProviderMode, expiresAt, evaluatedAt, failClosed, rawTokenReturned]
      properties:
        allowed: { type: boolean }
        denialReason: { type: string }
        userId: { type: string }
        sessionId: { type: string }
        identityProviderMode: { type: string, enum: [local_synthetic, clinicos_delegate, oidc_delegate, saml_delegate] }
        purposeOfUse: { type: string, enum: [treatment, payment, operations, support, audit, coaching, break_glass] }
        expiresAt: { type: string, format: date-time }
        evaluatedAt: { type: string, format: date-time }
        failClosed: { type: boolean, enum: [true] }
        rawTokenReturned: { type: boolean, enum: [false] }
    ProductionConfigValidationRequest:
      type: object
      required: [environment, secretSources]
      properties:
        environment: { type: string, enum: [local, staging, production] }
        secretSources:
          type: array
          items:
            $ref: '#/components/schemas/SecretSourceStatus'
        highRiskFlags:
          type: array
          items:
            type: object
            required: [key, enabled]
            properties:
              key: { type: string }
              enabled: { type: boolean }
              approvalId: { type: string }
    ProductionConfigValidation:
      type: object
      required: [environment, valid, failClosed, errors, warnings, secretValuesReturned, productionCredentialsRequired]
      properties:
        environment: { type: string, enum: [local, staging, production] }
        valid: { type: boolean }
        failClosed: { type: boolean, enum: [true] }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        secretValuesReturned: { type: boolean, enum: [false] }
        productionCredentialsRequired: { type: boolean }
    UpdateWorkforceUserRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, disabled] }
        reason: { type: string }
    UpdateGovernedFeatureFlagRequest:
      type: object
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        approvalId: { type: string }
        reason: { type: string }
    PlatformActionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            platform:
              $ref: '#/components/schemas/PlatformAdminView'
            sessionDecision:
              $ref: '#/components/schemas/SessionEvaluation'
            configValidation:
              $ref: '#/components/schemas/ProductionConfigValidation'
            featureFlag:
              $ref: '#/components/schemas/GovernedFeatureFlag'
            user:
              $ref: '#/components/schemas/WorkforceUserAdmin'
            auditEvent:
              $ref: '#/components/schemas/AuditEvent'
            domainEvents:
              type: array
              items:
                $ref: '#/components/schemas/AuraNoteEvent'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PlatformAdminResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PlatformAdminView'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    Appointment:
      type: object
      required: [appointmentId, tenantId, siteId, safePatientId, clinicianId, noteId, state, startsAt, durationMinutes, visitType, modality, source, mode]
      properties:
        appointmentId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        noteId: { type: string }
        state:
          type: string
          enum: [scheduled, checked_in, in_room, visit_started, visit_paused, visit_completed, finalization_in_progress, finalized, cancelled, no_show]
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        visitType: { type: string }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        source: { type: string, enum: [standalone, ehr_import, clinicos] }
        reasonForVisit: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
    CreateAppointmentRequest:
      type: object
      required: [safePatientId, clinicianId, visitType, startsAt, durationMinutes, modality]
      properties:
        safePatientId: { type: string }
        clinicianId: { type: string }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        reasonForVisit: { type: string }
    UpdateAppointmentRequest:
      type: object
      properties:
        clinicianId: { type: string }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        reasonForVisit: { type: string }
    AppointmentStatusActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [check_in, cancel, mark_no_show] }
        reason: { type: string }
    StandalonePatient:
      type: object
      required: [patientId, tenantId, siteId, safePatientId, status, displayLabel, createdAt, updatedAt, mode]
      properties:
        patientId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        status: { type: string, enum: [active, inactive] }
        displayLabel: { type: string }
        preferredModality: { type: string, enum: [in_person, telehealth, phone] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
    StandalonePatientLinkage:
      type: object
      required: [patientLinkageId, tenantId, siteId, safePatientId, linkedObjectType, linkedObjectId, purpose, active, createdAt]
      properties:
        patientLinkageId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        appointmentId: { type: string }
        noteId: { type: string }
        linkedObjectType: { type: string, enum: [appointment, note, chart_context, task, finalization] }
        linkedObjectId: { type: string }
        purpose: { type: string, enum: [treatment, documentation, operations] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateStandalonePatientRequest:
      type: object
      required: [safePatientId]
      properties:
        safePatientId: { type: string }
        displayLabel: { type: string }
        preferredModality: { type: string, enum: [in_person, telehealth, phone] }
    UpdateStandalonePatientRequest:
      type: object
      properties:
        displayLabel: { type: string }
        status: { type: string, enum: [active, inactive] }
        preferredModality: { type: string, enum: [in_person, telehealth, phone] }
    StandaloneChartContextSnapshot:
      type: object
      required: [chartContextSnapshotId, tenantId, siteId, safePatientId, sourceSystem, sourceFreshness, staleWarning, warnings, aiPackagingAllowed, productionPhiStorageApproved, createdAt, mode]
