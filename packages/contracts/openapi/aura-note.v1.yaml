openapi: 3.1.0
info:
  title: AURA Note v1 API
  version: 0.1.0
  description: Initial API contract seed for AURA Note standalone and ClinicOS-integrated modes.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200': { description: OK }
  /schedule/appointments:
    get:
      operationId: listAppointments
      responses:
        '200':
          description: Appointment list with note shell status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewResponse'
    post:
      operationId: createAppointment
      description: Create standalone appointment and one-to-one note shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Created appointment and one-to-one note shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppointmentResponse'
  /standalone/patients:
    get:
      operationId: searchStandalonePatients
      description: WO-038 implemented synthetic standalone patient shell search. Real PHI and production patient matching are out of scope.
      responses:
        '200':
          description: Synthetic standalone patient shells.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandalonePatientSearchResponse'
    post:
      operationId: createStandalonePatientShell
      description: Create a standalone patient shell with a safe synthetic patient identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStandalonePatientRequest'
      responses:
        '201':
          description: Standalone patient shell created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandalonePatientResponse'
  /standalone/patients/{safePatientId}:
    patch:
      operationId: updateStandalonePatientShell
      description: Update synthetic standalone patient shell metadata without real PHI.
      parameters:
        - name: safePatientId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStandalonePatientRequest'
      responses:
        '200':
          description: Standalone patient shell updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandalonePatientResponse'
  /standalone/operations/tasks:
    get:
      operationId: listStandaloneOperationTasks
      description: WO-039 implemented synthetic task inbox and MA follow-up worklist.
      responses:
        '200':
          description: Synthetic standalone task worklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskWorklistResponse'
  /standalone/operations/tasks/{taskId}:
    patch:
      operationId: updateStandaloneOperationTask
      description: Update task adjudication and blocker status with audit/event evidence.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperationalTaskRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/billing-review:
    get:
      operationId: listStandaloneBillingReviewQueue
      description: WO-039 billing review queue with transcript access limited to triggered review context.
      responses:
        '200':
          description: Synthetic billing review queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingReviewQueueResponse'
  /standalone/operations/billing-review/{billingReviewId}:
    patch:
      operationId: updateStandaloneBillingReview
      description: Update billing review status without submitting claims.
      parameters:
        - name: billingReviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingReviewRequest'
      responses:
        '200':
          description: Billing review updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/settings:
    get:
      operationId: getStandaloneSettingsAdminCenter
      description: Synthetic settings/admin/integrations center with disabled/mock adapter status.
      responses:
        '200':
          description: Settings/admin center.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsAdminResponse'
  /standalone/operations/settings/integrations/{integrationId}:
    patch:
      operationId: updateStandaloneIntegrationStatus
      description: Update disabled/mock integration scaffold status; no live credentials are accepted.
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationRequest'
      responses:
        '200':
          description: Integration status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/templates:
    get:
      operationId: listStandaloneTemplates
      description: List synthetic templates and dot phrases with safe variables only.
      responses:
        '200':
          description: Templates and dot phrases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesResponse'
    post:
      operationId: createStandaloneTemplate
      description: Create a synthetic template; obvious PHI and unsafe variables are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/dot-phrases/{dotPhraseId}:
    patch:
      operationId: updateStandaloneDotPhrase
      description: Update a synthetic dot phrase; obvious PHI and unsafe variables are rejected.
      parameters:
        - name: dotPhraseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDotPhraseRequest'
      responses:
        '200':
          description: Dot phrase updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/estimate-config:
    get:
      operationId: getStandaloneEstimateConfig
      description: View internal-only estimate configuration; patient-facing estimates are disabled.
      responses:
        '200':
          description: Estimate configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateConfigurationResponse'
    patch:
      operationId: updateStandaloneEstimateConfig
      description: Update internal-only estimate caveats; patient-facing financial conclusions are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstimateConfigurationRequest'
      responses:
        '200':
          description: Estimate configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /standalone/operations/rules-catalog:
    get:
      operationId: listStandaloneRulesCatalog
      description: List draft/human-review-required rules catalog seeds.
      responses:
        '200':
          description: Rules catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesCatalogResponse'
  /standalone/operations/rules-catalog/publish:
    post:
      operationId: publishStandaloneRulesCatalogEntries
      description: Publish synthetic rules only with human-review attestation; no autonomous coding or medical-necessity decision is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRulesCatalogRequest'
      responses:
        '201':
          description: Rules catalog entries published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActionResponse'
  /schedule/appointments/{appointmentId}:
    patch:
      operationId: updateStandaloneAppointment
      description: Edit appointment metadata while preserving the one appointment to one note invariant.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentActionResponse'
  /schedule/appointments/{appointmentId}/status:
    post:
      operationId: updateStandaloneAppointmentStatus
      description: Check in, cancel, or mark no-show for a standalone appointment.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentStatusActionRequest'
      responses:
        '201':
          description: Appointment lifecycle status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentActionResponse'
  /schedule/appointments/{appointmentId}/chart-context:
    get:
      operationId: getStandaloneChartContextSnapshot
      description: Return source-linked synthetic/local chart-context snapshot metadata; live EHR completeness is not implied.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Synthetic standalone chart-context snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneChartContextResponse'
  /schedule/appointments/{appointmentId}/start-visit:
    post:
      operationId: startVisit
      description: Starts visit session scaffold and activates note shell. Full timer, recording, and transcription depth is implemented in later work orders.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartVisitResponse'
  /notes/drafts:
    get:
      operationId: listDraftNotes
      description: CP-1 implemented Draft Notes shell for notes that have entered the visit workflow.
      responses:
        '200':
          description: Draft notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftNotesViewResponse'
  /notes/finalized:
    get:
      operationId: listFinalizedNotes
      description: CP-1 implemented read-only finalized note list shell.
      responses:
        '200':
          description: Finalized notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNotesViewResponse'
  /notes/finalized/{noteId}:
    get:
      operationId: getFinalizedNoteReadOnly
      description: CP-1 read-only finalized note placeholder. Does not generate or edit final clinical content.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Read-only finalized note placeholder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNoteResponse'
  /documentation-workspace/appointments/{appointmentId}:
    get:
      operationId: getDocumentationWorkspaceByAppointment
      description: CP-1 implemented Documentation Workspace shell for an appointment-linked note.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Documentation Workspace shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationWorkspaceResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/pause:
    post:
      operationId: pauseVisitSession
      description: Pause the CP-1 synthetic visit timer and lock the editor.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/resume:
    post:
      operationId: resumeVisitSession
      description: Resume the CP-1 synthetic visit timer and unlock the editor.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/visit-session/stop:
    post:
      operationId: stopVisitSession
      description: Stop the CP-1 synthetic visit timer and normal recording scaffold.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/recording-exception:
    post:
      operationId: approveRecordingException
      description: Approve a no-audio documentation exception without marking normal recording active.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingExceptionRequest'
      responses:
        '201':
          description: Recording exception approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/recording/permission:
    post:
      operationId: recordMicrophonePermissionState
      description: Record explicit browser microphone permission state as audit-safe metadata only; live audio storage remains disabled.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMicrophonePermissionRequest'
      responses:
        '201':
          description: Microphone permission state recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPermissionResponse'
  /documentation-workspace/appointments/{appointmentId}/recording/chunks:
    post:
      operationId: appendRecordingChunkMetadata
      description: Append metadata-only synthetic recording chunk evidence. Raw audio payload persistence is disabled.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendRecordingChunkRequest'
      responses:
        '201':
          description: Recording chunk metadata accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingChunkResponse'
  /documentation-workspace/appointments/{appointmentId}/recording/retention:
    get:
      operationId: getRecordingRetentionMetadata
      description: Return raw-audio one-week retention metadata and transcript indefinite-retention posture.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Recording retention metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingRetentionResponse'
  /documentation-workspace/appointments/{appointmentId}/transcription/provider-status:
    get:
      operationId: getTranscriptionProviderStatus
      description: Return mock-only transcription provider status and disabled live-provider governance posture.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Transcription provider status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionProviderStatusResponse'
  /documentation-workspace/appointments/{appointmentId}/transcription/jobs/mock:
    post:
      operationId: processMockTranscriptionJob
      description: Process deterministic mock transcription from metadata-only chunks without calling a live provider.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Mock transcription job processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionJobResponse'
  /documentation-workspace/appointments/{appointmentId}/transcript:
    get:
      operationId: getMockTranscript
      description: Read CP-1 mock transcript segments. Transcript retention is indefinite.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Mock transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptResponse'
  /documentation-workspace/appointments/{appointmentId}/transcript/segments:
    post:
      operationId: appendMockTranscriptSegment
      description: Append a synthetic mock transcript segment while the timer or exception gate allows documentation.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendTranscriptSegmentRequest'
      responses:
        '201':
          description: Mock transcript segment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionControlResponse'
  /documentation-workspace/appointments/{appointmentId}/transcript/segments/{transcriptSegmentId}/correction:
    post:
      operationId: correctTranscriptSegment
      description: Record audit-safe transcript correction history for a mock transcript segment.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
        - name: transcriptSegmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectTranscriptSegmentRequest'
      responses:
        '201':
          description: Transcript segment correction recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptCorrectionResponse'
  /notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Note }
    patch:
      operationId: updateNoteDraft
      description: Update note draft only when timer gate permits editing.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
  /notes/{noteId}/suggestions/evaluate:
    post:
      operationId: evaluateSuggestions
      responses:
        '201':
          description: Deterministic CP-1 suggestions evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/suggestions:
    get:
      operationId: listSuggestions
      responses:
        '200':
          description: Deterministic CP-1 suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsViewResponse'
  /notes/{noteId}/suggestions/{suggestionId}/accept:
    post:
      operationId: acceptSuggestion
      description: Accept a draft-only suggestion into Visit Selections. Low-confidence diagnosis candidates require override metadata.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '201':
          description: Suggestion accepted into Visit Selections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/suggestions/{suggestionId}/remove:
    post:
      operationId: removeSuggestion
      responses:
        '201':
          description: Suggestion removed from candidate review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/visit-selections:
    get:
      operationId: listVisitSelections
      responses:
        '200':
          description: Visit Selections for the note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSelectionsViewResponse'
    post:
      operationId: addVisitSelection
      responses:
        '201':
          description: Visit selection added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/compliance/evaluate:
    post:
      operationId: evaluateCompliance
      responses:
        '200': { description: Compliance evaluated }
  /notes/{noteId}/compliance:
    get:
      operationId: getComplianceReview
      responses:
        '200':
          description: Compliance and quality review state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReviewResponse'
  /notes/{noteId}/history-gaps:
    get:
      operationId: listHistoryGaps
      responses:
        '200':
          description: History gap questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryGapQuestionsResponse'
  /notes/{noteId}/history-gaps/{questionId}/tasks:
    post:
      operationId: createHistoryGapTask
      description: Create an MA follow-up task from a History Gap question. Blocking tasks prevent finalize preparation.
      responses:
        '201':
          description: History Gap task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponse'
  /notes/{noteId}/tasks:
    post:
      operationId: createNoteTask
      responses:
        '201': { description: Task created }
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      responses:
        '200': { description: Task updated }
  /notes/{noteId}/finalization/start:
    post:
      operationId: startFinalization
      description: Start the WO-006 finalization wizard from a frozen synthetic note snapshot.
      responses:
        '201':
          description: Finalization started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization:
    get:
      operationId: getFinalizationSession
      responses:
        '200':
          description: Current finalization session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationSessionResponse'
  /notes/{noteId}/finalization/code-review/selections/{visitSelectionId}:
    post:
      operationId: decideFinalizationSelection
      description: Record a Step 1 keep/remove/convert/follow-up decision for a selected item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizationSelectionDecisionRequest'
      responses:
        '201':
          description: Selection decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/code-review/complete:
    post:
      operationId: completeCodeReview
      responses:
        '201':
          description: Code Review completed when every selected item has a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/suggestion-review/suggestions/{suggestionId}:
    post:
      operationId: decideFinalizationSuggestion
      description: Record a Step 2 keep/remove decision for a final-pass suggestion over 50 percent confidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizationSuggestionDecisionRequest'
      responses:
        '201':
          description: Suggestion decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/suggestion-review/complete:
    post:
      operationId: completeSuggestionReview
      responses:
        '201':
          description: Suggestion Review completed when every final-pass suggestion has a decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compose:
    post:
      operationId: composeFinalizationDrafts
      responses:
        '201':
          description: Deterministic mock compose completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/original:
    post:
      operationId: updateCompareEditOriginal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareEditUpdateRequest'
      responses:
        '201':
          description: Original-side compare/edit text updated and enhanced output marked stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/rebeautify:
    post:
      operationId: rebeautifyFinalization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebeautifyRequest'
      responses:
        '201':
          description: Enhanced note and patient summary regenerated from updated source text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizationActionResponse'
  /notes/{noteId}/finalization/compare-edit/approve-note:
    post:
      operationId: approveFinalNote
