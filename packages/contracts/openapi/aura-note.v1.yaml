openapi: 3.1.0
info:
  title: AURA Note v1 API
  version: 0.1.0
  description: Initial API contract seed for AURA Note standalone and ClinicOS-integrated modes.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200': { description: OK }
  /schedule/appointments:
    get:
      operationId: listAppointments
      responses:
        '200':
          description: Appointment list with note shell status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewResponse'
    post:
      operationId: createAppointment
      description: Create standalone appointment and one-to-one note shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Created appointment and one-to-one note shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppointmentResponse'
  /schedule/appointments/{appointmentId}/start-visit:
    post:
      operationId: startVisit
      description: Starts visit session scaffold and activates note shell. Full timer, recording, and transcription depth is implemented in later work orders.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Visit started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartVisitResponse'
  /notes/drafts:
    get:
      operationId: listDraftNotes
      description: CP-1 implemented Draft Notes shell for notes that have entered the visit workflow.
      responses:
        '200':
          description: Draft notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftNotesViewResponse'
  /notes/finalized:
    get:
      operationId: listFinalizedNotes
      description: CP-1 implemented read-only finalized note list shell.
      responses:
        '200':
          description: Finalized notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNotesViewResponse'
  /notes/finalized/{noteId}:
    get:
      operationId: getFinalizedNoteReadOnly
      description: CP-1 read-only finalized note placeholder. Does not generate or edit final clinical content.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Read-only finalized note placeholder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedNoteResponse'
  /documentation-workspace/appointments/{appointmentId}:
    get:
      operationId: getDocumentationWorkspaceByAppointment
      description: CP-1 implemented Documentation Workspace shell for an appointment-linked note.
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Documentation Workspace shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationWorkspaceResponse'
  /notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Note }
    patch:
      operationId: updateNoteDraft
      description: Update note draft only when timer gate permits editing.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
  /notes/{noteId}/suggestions/evaluate:
    post:
      operationId: evaluateSuggestions
      responses:
        '200': { description: Suggestions evaluated }
  /notes/{noteId}/visit-selections:
    post:
      operationId: addVisitSelection
      responses:
        '201': { description: Visit selection added }
  /notes/{noteId}/compliance/evaluate:
    post:
      operationId: evaluateCompliance
      responses:
        '200': { description: Compliance evaluated }
  /notes/{noteId}/history-gaps:
    get:
      operationId: listHistoryGaps
      responses:
        '200': { description: History gap questions }
  /notes/{noteId}/tasks:
    post:
      operationId: createNoteTask
      responses:
        '201': { description: Task created }
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      responses:
        '200': { description: Task updated }
  /notes/{noteId}/finalization/start:
    post:
      operationId: startFinalization
      responses:
        '200': { description: Finalization started }
  /notes/{noteId}/finalization/code-review:
    post:
      operationId: completeCodeReview
      responses:
        '200': { description: Code review completed }
  /notes/{noteId}/finalization/suggestion-review:
    post:
      operationId: completeSuggestionReview
      responses:
        '200': { description: Suggestion review completed }
  /notes/{noteId}/finalization/compose:
    post:
      operationId: composeFinalizationDrafts
      responses:
        '200': { description: Compose completed }
  /notes/{noteId}/finalization/compare-edit:
    post:
      operationId: approveCompareEdit
      responses:
        '200': { description: Compare/Edit approved }
  /notes/{noteId}/finalization/billing-attest:
    post:
      operationId: completeBillingAttest
      responses:
        '200': { description: Billing & Attest completed }
  /notes/{noteId}/finalization/sign-dispatch:
    post:
      operationId: signAndDispatch
      responses:
        '200': { description: Signed and dispatched }
  /notes/{noteId}/exports/final-note-pdf:
    post:
      operationId: generateFinalNotePdf
      responses:
        '200': { description: PDF generated }
  /notes/{noteId}/exports/patient-summary-pdf:
    post:
      operationId: generatePatientSummaryPdf
      responses:
        '200': { description: PDF generated }
  /notes/{noteId}/billing/draft-claim-preview:
    get:
      operationId: getDraftClaimPreview
      responses:
        '200': { description: Draft claim preview }
  /settings/templates:
    get:
      operationId: listTemplates
      responses:
        '200': { description: Templates }
    post:
      operationId: createTemplate
      responses:
        '201': { description: Template created }
  /settings/dot-phrases:
    get:
      operationId: listDotPhrases
      responses:
        '200': { description: Dot phrases }
    post:
      operationId: createDotPhrase
      responses:
        '201': { description: Dot phrase created }
  /coaching/own:
    get:
      operationId: getOwnCoaching
      responses:
        '200': { description: Own coaching }
  /coaching/dashboard:
    get:
      operationId: getCoachingDashboard
      responses:
        '200': { description: Premium coaching dashboard }
  /integrations/ehr/status:
    get:
      operationId: getEhrStatus
      responses:
        '200': { description: EHR status }
  /integrations/clinicos/status:
    get:
      operationId: getClinicOsStatus
      responses:
        '200': { description: ClinicOS status }
components:
  schemas:
    ApiMeta:
      type: object
      properties:
        requestId: { type: string }
        traceId: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
        generatedAt: { type: string, format: date-time }
    ApiWarning:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [info, warning, error] }
    Appointment:
      type: object
      required: [appointmentId, tenantId, siteId, safePatientId, clinicianId, noteId, state, startsAt, durationMinutes, visitType, modality, source, mode]
      properties:
        appointmentId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        noteId: { type: string }
        state:
          type: string
          enum: [scheduled, checked_in, in_room, visit_started, visit_paused, visit_completed, finalization_in_progress, finalized, cancelled, no_show]
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        visitType: { type: string }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        source: { type: string, enum: [standalone, ehr_import, clinicos] }
        reasonForVisit: { type: string }
        mode: { type: string, enum: [standalone, clinicos_integrated] }
    CreateAppointmentRequest:
      type: object
      required: [safePatientId, clinicianId, visitType, startsAt, durationMinutes, modality]
      properties:
        safePatientId: { type: string }
        clinicianId: { type: string }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        modality: { type: string, enum: [in_person, telehealth, phone] }
        reasonForVisit: { type: string }
    ScheduleAppointment:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [noteStatus, noteVisibleInDrafts, startVisitEnabled, ehrSchedulingEnabled, clinicOsSchedulingEnabled]
          properties:
            noteStatus:
              type: string
              enum: [shell_created, draft_not_started, visit_active, visit_paused, documentation_in_progress, ready_to_finalize, finalization_code_review, finalization_suggestion_review, finalization_compose, finalization_compare_edit, finalization_billing_attest, finalization_sign_dispatch, blocked_compliance, blocked_history_gap, blocked_billing_review, finalized, exported, writeback_pending, writeback_complete, writeback_failed]
            noteVisibleInDrafts: { type: boolean }
            startVisitEnabled: { type: boolean }
            ehrSchedulingEnabled: { type: boolean }
            clinicOsSchedulingEnabled: { type: boolean }
    ScheduleView:
      type: object
      required: [appointments, ehrSchedulingEnabled, clinicOsSchedulingEnabled]
      properties:
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleAppointment'
        ehrSchedulingEnabled: { type: boolean }
        clinicOsSchedulingEnabled: { type: boolean }
    ScheduleViewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ScheduleView'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    CreateAppointmentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [appointment, note, auditEvent, domainEvents]
          properties:
            appointment:
              $ref: '#/components/schemas/Appointment'
            note:
              $ref: '#/components/schemas/Note'
            auditEvent:
              $ref: '#/components/schemas/AuditEvent'
            domainEvents:
              type: array
              items:
                $ref: '#/components/schemas/AuraNoteEvent'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    StartVisitResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [appointment, note, visitSession, auditEvent, domainEvents]
          properties:
            appointment:
              $ref: '#/components/schemas/Appointment'
            note:
              $ref: '#/components/schemas/Note'
            visitSession:
              $ref: '#/components/schemas/VisitSession'
            auditEvent:
              $ref: '#/components/schemas/AuditEvent'
            domainEvents:
              type: array
              items:
                $ref: '#/components/schemas/AuraNoteEvent'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    DraftNoteSummary:
      type: object
      required: [noteId, appointmentId, safePatientId, clinicianId, visitType, startsAt, noteStatus, appointmentStatus, workflowStatusLabel, editorLocked]
      properties:
        noteId: { type: string }
        appointmentId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        visitType: { type: string }
        startsAt: { type: string, format: date-time }
        noteStatus:
          type: string
          enum: [shell_created, draft_not_started, visit_active, visit_paused, documentation_in_progress, ready_to_finalize, finalization_code_review, finalization_suggestion_review, finalization_compose, finalization_compare_edit, finalization_billing_attest, finalization_sign_dispatch, blocked_compliance, blocked_history_gap, blocked_billing_review, finalized, exported, writeback_pending, writeback_complete, writeback_failed]
        appointmentStatus:
          type: string
          enum: [scheduled, checked_in, in_room, visit_started, visit_paused, visit_completed, finalization_in_progress, finalized, cancelled, no_show]
        workflowStatusLabel: { type: string }
        editorLocked: { type: boolean }
        editorLockedReason: { type: string }
    FinalizedNoteSummary:
      type: object
      required: [noteId, appointmentId, safePatientId, clinicianId, readOnly, finalNoteAvailable, patientSummaryAvailable, transcriptAvailableForRole]
      properties:
        noteId: { type: string }
        appointmentId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        finalizedAt: { type: string, format: date-time }
        readOnly: { type: boolean, const: true }
        finalNoteAvailable: { type: boolean }
        patientSummaryAvailable: { type: boolean }
        transcriptAvailableForRole: { type: boolean }
    WorkspacePanel:
      type: object
      required: [panelId, label, state, itemCount]
      properties:
        panelId:
          type: string
          enum: [visit_context, controls, editor, visit_selections, suggestions, transcript, compliance, history_gap]
        label: { type: string }
        state:
          type: string
          enum: [empty, loading, ready, saving, warning, blocked, failed, permission_denied, finalized_read_only, demo_fixture]
        blockedReason: { type: string }
        itemCount: { type: integer, minimum: 0 }
    DocumentationWorkspace:
      type: object
      required: [appointment, note, editorLocked, finalizedReadOnly, panels, availableStates]
      properties:
        appointment:
          $ref: '#/components/schemas/Appointment'
        note:
          $ref: '#/components/schemas/Note'
        visitSession:
          $ref: '#/components/schemas/VisitSession'
        editorLocked: { type: boolean }
        editorLockedReason: { type: string }
        finalizedReadOnly: { type: boolean }
        panels:
          type: array
          items:
            $ref: '#/components/schemas/WorkspacePanel'
        availableStates:
          type: array
          items:
            type: string
            enum: [empty, loading, ready, saving, warning, blocked, failed, permission_denied, finalized_read_only, demo_fixture]
    DraftNotesViewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [notes, emptyState]
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/DraftNoteSummary'
            emptyState:
              type: string
              enum: [empty, loading, ready, saving, warning, blocked, failed, permission_denied, finalized_read_only, demo_fixture]
        meta:
          $ref: '#/components/schemas/ApiMeta'
    FinalizedNotesViewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [notes, emptyState, readOnly]
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/FinalizedNoteSummary'
            emptyState:
              type: string
              enum: [empty, loading, ready, saving, warning, blocked, failed, permission_denied, finalized_read_only, demo_fixture]
            readOnly: { type: boolean, const: true }
        meta:
          $ref: '#/components/schemas/ApiMeta'
    FinalizedNoteResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FinalizedNoteSummary'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    DocumentationWorkspaceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DocumentationWorkspace'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    Note:
      type: object
      required: [noteId, appointmentId, tenantId, siteId, safePatientId, clinicianId, state, mode]
      properties:
        noteId: { type: string }
        appointmentId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        safePatientId: { type: string }
        clinicianId: { type: string }
        state:
          type: string
          enum: [shell_created, draft_not_started, visit_active, visit_paused, documentation_in_progress, ready_to_finalize, finalization_code_review, finalization_suggestion_review, finalization_compose, finalization_compare_edit, finalization_billing_attest, finalization_sign_dispatch, blocked_compliance, blocked_history_gap, blocked_billing_review, finalized, exported, writeback_pending, writeback_complete, writeback_failed]
        mode: { type: string, enum: [standalone, clinicos_integrated] }
    VisitSession:
      type: object
      required: [visitSessionId, noteId, timerState, recordingState, editorUnlocked]
      properties:
        visitSessionId: { type: string }
        noteId: { type: string }
        timerState: { type: string, enum: [not_started, running, paused, stopped] }
        recordingState: { type: string, enum: [not_started, recording, paused, stopped, exception_approved] }
        editorUnlocked: { type: boolean }
        exceptionReason: { type: string }
    Task:
      type: object
      required: [taskId, title, blocksSigning, adjudicationStatus]
      properties:
        taskId: { type: string }
        noteId: { type: string }
        safePatientId: { type: string }
        title: { type: string }
        blocksSigning: { type: boolean }
        adjudicationStatus: { type: string, enum: [open, answered, closed, assigned, deferred] }
        ownerRole: { type: string }
    AuraNoteEvent:
      type: object
      required: [eventId, eventType, schemaVersion, tenantId, siteId, producer, eventTime, traceId, idempotencyKey, sensitivity, retentionClass, payload]
      properties:
        eventId: { type: string }
        eventType:
          type: string
          enum: [appointment.created.v1, note.shell_created.v1, visit.started.v1, visit.paused.v1, visit.resumed.v1, visit.stopped.v1, recording.started.v1, recording.exception_approved.v1, recording.stopped.v1, task.blocker_changed.v1, low_confidence_diagnosis.override_recorded.v1, finalization.started.v1, finalization.step_completed.v1, audit.event_recorded.v1]
        schemaVersion: { type: string, enum: [v1] }
        tenantId: { type: string }
        siteId: { type: string }
        patientIdHash: { type: string }
        appointmentId: { type: string }
        noteId: { type: string }
        visitSessionId: { type: string }
        producer: { type: string }
        eventTime: { type: string, format: date-time }
        traceId: { type: string }
        idempotencyKey: { type: string }
        sensitivity: { type: string, enum: [non_phi, phi_reference, restricted] }
        retentionClass: { type: string, enum: [standard, audit, transcript, audio_ephemeral] }
        payload: { type: object }
    AuditEvent:
      type: object
      required: [auditEventId, tenantId, action, entityType, entityId, traceId, createdAt]
      properties:
        auditEventId: { type: string }
        tenantId: { type: string }
        siteId: { type: string }
        actorUserId: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        traceId: { type: string }
        createdAt: { type: string, format: date-time }
