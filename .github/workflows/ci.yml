name: AURA Note CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:client:generate
      - run: pnpm lint
      - run: pnpm lint:phi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm persistence:foundation
      - run: pnpm persistence:runtime-readiness
      - run: pnpm persistence:adapter-readiness
      - run: pnpm persistence:local-db-readiness
      - run: pnpm persistence:local-db:migrate-evidence
      - run: pnpm persistence:prisma-schedule-adapter
      - run: pnpm persistence:tenant-isolation
      - run: pnpm persistence:visit-capture-adapter
      - run: pnpm persistence:review-panel-adapter
      - run: pnpm persistence:finalization-output-adapter
      - run: pnpm persistence:durable-runtime-readiness
      - run: pnpm runtime:persistence-readiness
      - run: pnpm api:runtime-hardening-readiness
      - run: pnpm identity:runtime-boundary-readiness
      - run: pnpm persistence:phi-db-review-readiness
      - run: pnpm standalone:patient-schedule-readiness
      - run: pnpm standalone:operations-readiness
      - run: pnpm audio:transcription-readiness
      - run: pnpm transcription:runtime-boundary-readiness
      - run: pnpm transcription:live-review-readiness
      - run: pnpm identity:production-readiness
      - run: pnpm identity:live-review-readiness
      - run: pnpm config:production-readiness
      - run: pnpm observability:production-readiness
      - run: pnpm ehr:integration-readiness
      - run: pnpm ehr:sandbox-runtime-readiness
      - run: pnpm ehr:live-review-readiness
      - run: pnpm clinicos:integration-readiness
      - run: pnpm clinicos:live-review-readiness
      - run: pnpm mode:adapter-readiness
      - run: pnpm ai:governance-readiness
      - run: pnpm ai:runtime-governance-readiness
      - run: pnpm ai:live-review-readiness
      - run: pnpm security:review-readiness
      - run: pnpm frontend:runtime-integration-readiness
      - run: pnpm frontend:primary-runtime-readiness
      - run: pnpm figma:backend-catch-up-readiness
      - run: pnpm figma:handoff-readiness
      - run: pnpm standalone:workflow-readiness
      - run: pnpm launch:readiness
      - run: pnpm storage:azure-adapter-readiness
      - run: pnpm storage:secure-download-readiness
      - run: pnpm retention:storage-deletion-readiness
      - run: pnpm retention:production-readiness
      - run: pnpm storage:live-review-readiness
      - run: pnpm claim-decision:readiness
      - run: pnpm security:commercial-readiness
      - run: pnpm ops:commercial-readiness
      - run: pnpm billing:revenue-integrity-readiness
      - run: pnpm beta:pilot-package-readiness
      - run: pnpm commercial:readiness
      - run: pnpm post-cr4:launch-governance
      - run: pnpm post-cr4:next-work-orders
      - run: pnpm commercial:readiness-plan
      - run: pnpm post-p11:readiness
      - run: pnpm production:readiness
      - run: pnpm acceptance:readiness
